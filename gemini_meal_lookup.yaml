# Configuration for gemini_meal_lookup.py.
#
# Every run, the script picks the N least-recently-checked eligible items
# out of candidate_pool.json and asks Gemini -- from its own training
# knowledge, no Google Search grounding -- for each item's estimated
# calories-per-serving and price, writing the results back into
# candidate_pool.json. Since Gemini isn't actually browsing walmart.com
# here, treat "price" as a rough estimate rather than today's real price;
# calories tends to be more reliable since nutrition facts rarely change.

gemini:
  # Tried top to bottom, falling back to the next model immediately
  # whenever a model reports itself rate-limited, over quota, or
  # otherwise unavailable (any 4xx) -- same fallback behavior as
  # SportsDashboard's scripts/gemini_predictions.py.
  models:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
  timeout_seconds: 30
  # One request every N seconds, to stay well under per-minute rate limits.
  min_call_interval_seconds: 10
  # Non-rate-limit errors (network errors, 5xx, unusable response) retry
  # the SAME model after this many seconds.
  retry_delay_seconds: 60
  max_retries: 3

batch:
  # How many candidate_pool.json items to look up per run. At
  # min_call_interval_seconds=10, 10 items takes ~1-2 minutes, well
  # inside a 4-hour window.
  items_per_run: 10
  # Skip items already confirmed dead (active === false) -- no point
  # spending a Gemini call on a listing that's already gone.
  skip_inactive: true
  # How many items between incremental saves, so a long/interrupted run
  # doesn't lose progress.
  save_every: 5

pool:
  input_path: candidate_pool.json
  output_path: candidate_pool.json

# {product_name}, {brand}, {product_url}, {sku} are filled in per item.
prompt:
  template: |
    You are estimating information for a frozen food product sold at
    Walmart, based on what you already know -- you do NOT have the
    ability to browse the web or visit walmart.com right now, so do not
    claim to have looked anything up live.

    Product: {product_name}
    Brand: {brand}
    Walmart SKU: {sku}
    Walmart product URL (may be stale or redirected): {product_url}

    From your own knowledge, determine your best estimate of:
    1. Whether you recognize this specific product well enough to give a
       real estimate (as opposed to guessing blindly).
    2. The calories per serving, as it would appear on the product's
       nutrition facts.
    3. A typical/recent price in USD for this product at Walmart. Treat
       this as an approximate estimate, not a live price -- it may be
       out of date.

    Return ONLY a valid JSON object with exactly these keys, and nothing
    else -- no markdown code fences, no commentary before or after it:
    - "recognized": boolean -- true only if you actually recognize this
      specific product, false if you'd just be guessing
    - "calories": integer or JSON null if unknown
    - "price": number or JSON null if unknown (e.g. 3.98, no dollar sign)
    - "notes": string -- one short sentence on your confidence or
      reasoning, or why you don't recognize it

    Do not invent a source URL or claim to have verified this on
    walmart.com. If you do not recognize the product, set "recognized" to
    false and "calories"/"price" to null.
