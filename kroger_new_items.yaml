# Configuration for kroger_new_items.py.
#
# This script adds NEW frozen items (not already in candidate_pool.json)
# by pulling Kroger's live product catalog -- the one live, free,
# non-scraped source of "what frozen products currently exist" available
# here. Kroger has no "date added" field, so "new" means: in Kroger's
# catalog today AND not already in candidate_pool.json by fuzzy name
# match. It runs 4x a day (see .github/workflows/kroger-new-items.yml),
# pulling Kroger until it has added run.max_new_items new products. See
# the module docstring in kroger_new_items.py for the full step-by-step.
#
# Where each field on a new pool record comes from:
#   _kroger_upc, PRODUCT_NAME, BRAND, PRICE_CURRENT/PRICE_RETAIL -- Kroger
#       (price is the price at the store in kroger.location_id below)
#   PRODUCT_URL, SKU -- Serper.dev search for the Walmart page; SKU is the
#       id part of that URL, and ?fulfillmentIntent=Pickup is appended to
#       the URL
#   INSTACART_URL -- BUILT from the cleaned product name (never searched)
#   image_url -- DuckDuckGo Images, taking a Walmart/Kroger/Instacart/
#       Target/Aldi/Amazon-hosted result before any other
#   calories -- the LARGEST of USDA FoodData Central, Open Food Facts and
#       Gemini (Gemini answers from its own knowledge, no search), rounded
#       to the nearest 10 -- same "largest wins" rule as
#       DataCleaning/Max_Calories_Count.py
#   servings_per_container -- USDA FoodData Central, pulled the way
#       DataCleaning/build_meal_pool.py pulls it
#   SOURCE -- always "Kroger", to tell these rows apart from the original
#       2022 Walmart-CSV rows (which have no SOURCE column at all)
#
# A product is only added if it has ALL of: a Kroger price, a Walmart
# PRODUCT_URL whose SKU isn't already on an active=True pool item, an
# image_url, and at least one calorie number from the three sources.
# servings_per_container is the one exception -- a USDA miss becomes "N/A"
# rather than blocking the item.

dedup:
  # A Kroger item is treated as ALREADY IN THE POOL when its cleaned name
  # scores ABOVE this (0-100, rapidfuzz token_sort_ratio) against any
  # existing PRODUCT_NAME, cleaned the same way. "Cleaned" = the same
  # cleanup used to build the Instacart search: everything after the
  # first comma, sizes like "27 oz"/"6 ct", other numbers, punctuation
  # and the word "frozen" removed. The pool item with the HIGHEST score
  # gets the Kroger UPC recorded on it. Raise this to be pickier about
  # what counts as a duplicate (more items get added); lower it to skip
  # more.
  fuzzy_threshold: 75

usda:
  timeout_seconds: 15
  max_retries: 2
  retry_delay_seconds: 3
  # Space between USDA calls -- USDA's API is generous/free, but this is
  # a courtesy delay, not a rate-limit workaround.
  min_call_interval_seconds: 0.5

open_food_facts:
  # No API key, but Open Food Facts asks for a descriptive User-Agent, and
  # its anonymous SEARCH endpoint is tightly rate-limited (they document
  # roughly 10 requests/minute for searches) -- hence the long spacing.
  # Only a handful of new items get looked up per run, so this is cheap.
  user_agent: "FrozenMealDiet/1.0 (github.com/mzaiger/FrozenMealDiet)"
  timeout_seconds: 15
  max_retries: 2
  retry_delay_seconds: 5
  min_call_interval_seconds: 6.5

kroger:
  # The Kroger store to take prices from. REQUIRED -- Kroger's API only
  # returns prices when a search is scoped to a store, and this script
  # skips the run if there isn't one. The KROGER_LOCATION_ID environment
  # variable, if set, overrides this. To find an id, run:
  #     python kroger_new_items.py --find-location <ZIP>
  # (needs KROGER_CLIENT_ID / KROGER_CLIENT_SECRET set) and paste the
  # 8-character locationId of the store you want here, e.g. "01400943".
  location_id: ""

  # Kroger's own department groupings don't map 1:1 to Walmart's, so
  # this is a set of search terms run against filter.term instead of a
  # category ID. Deliberately broad/generic (e.g. "bowl", "meal" --
  # not "frozen bowl") so each term's 50-result page isn't wasted on an
  # over-narrow phrase match -- kroger_product_to_candidate() is what
  # actually keeps results scoped to frozen items, by checking Kroger's
  # own category labels for "frozen" rather than trusting the term.
  # Covers both "frozen meal" and "frozen breakfast aisle" per the
  # original ask.
  search_terms:
    - "bowl"
    - "meal"
    - "breakfast"
    - "dinner"
    - "entree"
    - "pizza"
    - "burrito"
    - "pasta"
    - "waffles"
    - "pancakes"
    - "french toast"
    - "breakfast sandwich"
    - "lasagna"
    - "chicken nuggets"
    - "pot pie"
    - "mac and cheese"
    - "fried rice"
    - "egg bites"
  # Kroger's product search caps at 50 results per page (filter.limit).
  results_per_term: 50
  # The run pulls Kroger one page at a time (round-robin across the terms
  # above) and stops as soon as it has added run.max_new_items new
  # products, so this is only a ceiling on how deep it will page into any
  # one term. Kroger's filter.start tops out at 1000, i.e. 20 pages of 50.
  max_pages_per_term: 20
  timeout_seconds: 15

serper:
  endpoint: "https://google.serper.dev/search"
  timeout_seconds: 15
  max_retries: 2
  retry_delay_seconds: 3

ddg_image:
  min_delay_seconds: 4.0
  max_delay_seconds: 9.0
  max_retries: 5
  region: "us-en"
  safesearch: "moderate"
  # Pulled higher than AddImageUrl.py's 5, so there's more of a chance a
  # trusted retailer (Walmart/Kroger/Instacart/Target/Aldi/Amazon -- see
  # is_trusted_image_host() in kroger_new_items.py) actually shows up
  # somewhere in the results, since search_image() takes one of those
  # before any other result whenever one's present.
  max_results: 8

gemini:
  # Same fallback chain as gemini_meal_lookup.py -- gemini-2.5-flash-lite
  # and gemini-2.0-flash-lite both 404 ("no longer available") as of
  # 2026-09-13.
  models:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
  timeout_seconds: 30
  min_call_interval_seconds: 10
  retry_delay_seconds: 60
  max_retries: 3

run:
  # Brand-new items to ADD per run. The run keeps pulling Kroger (it may
  # pull 100+ products to find this many new ones) until it has this many.
  max_new_items: 20
  # Ceiling on how many new products get run through the Serper/DDG
  # steps in one run, counting the ones that fail (no Walmart page, no
  # image, no calories) -- protects the Serper credit quota if Kroger's
  # remaining new products mostly turn out to be unsellable at Walmart.
  max_enrichment_attempts: 60
  # Stop starting new products after this long, so the workflow has time to
  # commit what the run did instead of being killed mid-run (which would
  # lose it). Keep it under the workflow's timeout-minutes.
  max_runtime_minutes: 35

pool:
  path: candidate_pool.json
  # New Kroger products that couldn't be added for a lasting reason (no
  # Walmart page, no image results, no calorie number) -- their UPCs are
  # kept here so they aren't retried every run. Delete an entry to retry.
  skipped_upcs_path: kroger_skipped_upcs.json

# {n}/{product_name}/{brand}/{size} are filled in per item; {count}/
# {products_block} wrap the request (one product per call now).
# {product_name} is Kroger's own product description for the item. Gemini
# is only asked for calories -- price comes from Kroger,
# servings_per_container from USDA, and the SKU from the Walmart URL.
prompt:
  item_line: |
    {n}. {product_name} ({brand}, size: {size})
  intro: |
    You are estimating the calories of {count} frozen food products, based
    on what you already know -- you do NOT have the ability to browse the
    web right now, so do not claim to have looked anything up live.

    Products:
    {products_block}

    For each product, give your best estimate of:
    1. "recognized" -- true only if you actually recognize this specific
       product well enough to give a real estimate, false if you'd just
       be guessing blindly.
    2. "calories" -- calories per serving, as it would appear on the
       product's nutrition facts.

    Return ONLY a JSON array with exactly {count} objects, in the same
    order as the list above, and nothing else -- no markdown code
    fences, no commentary before or after it. Each object must have
    exactly these keys:
    - "index": integer -- the product's number from the list above (1-based)
    - "recognized": boolean
    - "calories": integer or JSON null if unknown
    - "notes": string -- one short sentence on your confidence or
      reasoning, or why you don't recognize it

    Do not invent a source or claim to have verified anything on a
    website. If you do not recognize a product, set "recognized" to false
    and "calories" to null for it.
