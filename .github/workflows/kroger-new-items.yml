name: Discover new frozen items (Kroger + SerpApi + Gemini)

on:
  schedule:
    # Once daily. New-item discovery is a lower-frequency need than the
    # existing-item health checks (hourly active-URL check, 4-hourly
    # Gemini refresh) -- there's no reason to spend SerpApi/DDG/Gemini
    # calls looking for brand-new products more than once a day.
    - cron: "45 7 * * *"
  workflow_dispatch:
    inputs:
      max_new_items:
        description: "Brand-new items to fully enrich this run"
        required: false
        default: "20"

concurrency:
  group: kroger-new-items
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml ddgs

      - name: Run Kroger new-item discovery
        env:
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
          SERPAPI_KEY: ${{ secrets.SERPER_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          python kroger_new_items.py \
            --max-new-items "${{ github.event.inputs.max_new_items || 20 }}"

      - name: Commit updated pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add candidate_pool.json
          git diff --staged --quiet || git commit -m "Add new frozen items discovered via Kroger [automated]"
          git push
