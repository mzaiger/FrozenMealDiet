name: Check Walmart active URLs

on:
  schedule:
    # Runs once per hour.
    # :17 is used instead of :00 because top-of-hour GitHub cron runs
    # are more likely to be delayed due to GitHub Actions load.
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      batch_size:
        description: "How many unresolved items to check this run"
        required: false
        default: "100"

permissions:
  contents: write

concurrency:
  group: check-active-urls
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright playwright-stealth
          python -m playwright install --with-deps chromium

      - name: Check next batch of unresolved URLs
        run: |
          python check_active_urls.py --only-unknown \
            --limit "${{ github.event.inputs.batch_size || 100 }}"

      - name: Commit updated pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add candidate_pool.json
          git diff --quiet --cached || git commit -m "Check next batch of Walmart URLs"
          git push
